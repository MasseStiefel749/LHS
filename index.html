<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lernhub – gamifizierte Lern-App für Berufsschule und allgemeines Lernen: Quiz, Karteikarten, Sprech-Übungen, Wiederholungen und KI-Tipps. Offline, Open Source.">
<meta name="theme-color" content="#7c5cff">
<title>Lernhub – Lernen wie im Spiel</title>
<!-- Link-Vorschau (WhatsApp, Discord, …) – braucht absolute URLs -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lernhub">
<meta property="og:title" content="Lernhub – Lernen wie im Spiel">
<meta property="og:description" content="Kostenlos lernen mit Streaks, Bestenliste, Chat und Videos – zusammen mit deinen Freunden und deiner Klasse.">
<meta property="og:url" content="https://massestiefel749.github.io/LHS/">
<meta property="og:image" content="https://massestiefel749.github.io/LHS/icons/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="de_DE">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernhub">
<link rel="stylesheet" href="css/extra.css">
<link rel="stylesheet" href="css/neu.css">
<style>
:root{
  --pri:#7c5cff; --pri-d:#5a3ee0; --pri-l:#efeaff;
  --green:#2ecc71; --green-d:#22a85d; --red:#ff5c7a; --red-d:#e04261;
  --amber:#ffb020; --teal:#00d1b2; --blue:#3fa9f5;
  --bg:#f4f5fb; --card:#ffffff; --ink:#24263a; --mut:#7b7f9e; --line:#e6e8f5;
  --shadow:0 3px 0 rgba(0,0,0,.10); --r:16px;
  --ok:#2ecc71; --bad:#ff5c7a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--pri);cursor:pointer}
.hidden{display:none!important}
/* ---------- Layout ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:238px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:40}
#shell{margin-left:238px;min-height:100vh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:rgba(244,245,251,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
#app{max-width:920px;width:100%;margin:0 auto;padding:22px 18px 110px}
@media(max-width:900px){ #side{display:none} #shell{margin-left:0} #mnav{display:flex!important} #app{padding-bottom:150px} }
#mnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#mnav button{background:none;border:0;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:12px;cursor:pointer}
#mnav button span.ic{font-size:20px}
#mnav button.on{color:var(--pri);background:var(--pri-l);font-weight:700}
/* ---------- Sidebar ---------- */
.logo{font-weight:900;font-size:21px;padding:6px 8px 2px;cursor:pointer;user-select:none}
.logo small{display:block;font-weight:600;font-size:11px;color:var(--mut)}
#schoolBtn{width:100%;margin:12px 0 6px;background:var(--pri-l);border:1.5px solid #d9d0ff;color:var(--pri-d);border-radius:12px;padding:9px 10px;font-size:12.5px;font-weight:700;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;line-height:1.3}
#schoolBtn:hover{border-color:var(--pri)}
#nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
#nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
#nav button:hover{background:var(--bg)}
#nav button.on{background:var(--pri-l);color:var(--pri-d)}
#nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mut);padding:8px;line-height:1.9}
.sidefoot a{color:var(--mut)}
/* ---------- Chips / stats ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
.chip .sub{font-weight:600;font-size:11px;color:var(--mut)}
.chip.streak{color:#ff7a00;border-color:#ffe0b8;background:#fff8ec}
.chip.xp{color:var(--pri)}
.chip.hearts{color:var(--red)}
.ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--green) var(--p,0%), #e9eaf5 0);display:grid;place-items:center;font-size:10px;font-weight:800}
.ring i{background:var(--card);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.agentdot{width:9px;height:9px;border-radius:50%;background:#c3c6dd;display:inline-block}
.agentdot.on{background:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,.25)}
/* ---------- Cards / buttons ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px}
.btn{background:var(--pri);color:#fff;border:0;border-bottom:4px solid var(--pri-d);border-radius:14px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.2px;transition:.06s transform}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--green);border-bottom-color:var(--green-d)}
.btn.r{background:var(--red);border-bottom-color:var(--red-d)}
.btn.ghost{background:var(--card);color:var(--mut);border:1.5px solid var(--line);border-bottom-width:4px}
.btn.ghost:hover{color:var(--ink);border-color:var(--pri);filter:none}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.h1{font-size:27px;font-weight:900;margin:4px 0 6px}
.h2{font-size:19px;font-weight:800;margin:22px 0 10px}
.mut{color:var(--mut)}
.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
/* ---------- Progress ---------- */
.bar{background:#e9eaf5;border-radius:99px;height:14px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pri));border-radius:99px;transition:width .4s}
.bar.hearts i{background:linear-gradient(90deg,#ff8fa3,var(--red))}
/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,#7c5cff,#00d1b2);color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;font-size:25px;font-weight:900}
.hero p{margin:0;opacity:.92;font-size:14.5px}
.hero .big{position:absolute;right:-8px;bottom:-24px;font-size:120px;opacity:.16;transform:rotate(-12deg)}
.dailycard{display:flex;gap:14px;align-items:center}
.pill{display:inline-block;background:var(--pri-l);color:var(--pri-d);font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;margin-right:6px}
.pill.g{background:#e3f9ec;color:var(--green-d)} .pill.a{background:#fff3dd;color:#c77700} .pill.r{background:#ffe6ec;color:var(--red-d)}
/* ---------- Lernpfad (Duolingo-Style) ---------- */
.pathtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.pathtabs button{white-space:nowrap;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 15px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--mut)}
.pathtabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.path{display:flex;flex-direction:column;gap:0;padding:10px 0 30px}
.node{display:flex;align-items:center;gap:14px;margin:9px 0;position:relative}
.node:nth-child(odd){justify-content:flex-start;padding-left:6%}
.node:nth-child(even){justify-content:center}
.node:nth-child(3n){justify-content:flex-end;padding-right:6%}
.nbtn{width:66px;height:66px;border-radius:50%;border:0;font-size:27px;cursor:pointer;position:relative;display:grid;place-items:center;transition:.1s transform;background:#dfe1f0;border-bottom:6px solid #c8cbe0;color:#9aa0c0}
.nbtn:hover{transform:translateY(-2px)}
.nbtn.done{background:linear-gradient(180deg,#ffd966,#ffb020);border-bottom-color:#d98f00;color:#7a4d00}
.nbtn.now{background:linear-gradient(180deg,#8f77ff,#7c5cff);border-bottom-color:#5a3ee0;color:#fff;box-shadow:0 0 0 5px rgba(124,92,255,.22);animation:pulse 1.6s infinite}
.nbtn.rev{background:linear-gradient(180deg,#6ee7b7,#2ecc71);border-bottom-color:#1f9d57;color:#08532c}
.nbtn.vid{background:linear-gradient(180deg,#7dd3fc,#3fa9f5);border-bottom-color:#1f7ac2;color:#fff}
.nbtn.spk{background:linear-gradient(180deg,#fca5a5,#ff5c7a);border-bottom-color:#d63b58;color:#fff}
.nbtn.lock{cursor:not-allowed;opacity:.75}
.nbtn .lbl{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--mut);white-space:normal;width:max-content;max-width:min(190px,40vw);line-height:1.25;text-align:center;background:rgba(244,245,251,.85);padding:1px 7px;border-radius:8px}
.node:nth-child(odd) .lbl{left:0;transform:none;text-align:left}
.node:nth-child(even) .lbl{left:50%;transform:translateX(-50%);text-align:center}
.node:nth-child(3n) .lbl{left:auto;right:0;transform:none;text-align:right}
.node{margin-bottom:44px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(124,92,255,.22)}50%{box-shadow:0 0 0 10px rgba(124,92,255,.10)}}
/* ---------- Lesson ---------- */
.lessonhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lessonhead .bar{flex:1}
.xbtn{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.qtext{font-size:18.5px;font-weight:800;line-height:1.45;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#fbfbff;border:2px solid var(--line);border-bottom-width:4px;color:var(--ink);border-radius:14px;padding:13px 15px;font-size:15px;margin-top:10px;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--pri);background:var(--pri-l)}
.opt.correct{border-color:var(--green);background:#e9fbf1}
.opt.wrong{border-color:var(--red);background:#ffeff3}
.opt:disabled{cursor:default}
@media(hover:hover) and (pointer:fine){ .qcard{counter-reset:opt} .qcard .opt{counter-increment:opt} .qcard .opt:not(:disabled)::before{content:counter(opt);display:inline-grid;place-items:center;width:20px;height:20px;margin-right:10px;border:1.5px solid var(--line);border-radius:6px;font-size:11px;color:var(--mut);vertical-align:1px} }
.fb{border-radius:12px;padding:12px 15px;margin-top:14px;font-size:14.5px;line-height:1.55;display:none;font-weight:600}
.fb.show{display:block;animation:pop .18s}
.fb.ok{background:#e9fbf1;border:2px solid var(--green);color:#127a41}
.fb.bad{background:#ffeff3;border:2px solid var(--red);color:#b32c48}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.gapline{font-size:17px;line-height:2.6;font-weight:600}
.gapin{background:#f1f2fb;border:0;border-bottom:2.5px solid var(--pri);color:var(--ink);font-size:16px;padding:4px 8px;width:140px;border-radius:8px 8px 0 0;outline:none;margin:0 4px}
.gapin.ok{border-color:var(--green);background:#e9fbf1} .gapin.bad{border-color:var(--red);background:#ffeff3}
.freein{width:100%;background:#f1f2fb;border:2px solid var(--line);color:var(--ink);border-radius:13px;padding:13px 15px;font-size:16px;margin-top:12px;outline:none}
.freein:focus{border-color:var(--pri)}
/* Karteikarte */
.flip{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;cursor:pointer;font-size:20px;font-weight:800;line-height:1.5;margin-top:14px;user-select:none}
.flip.back{background:var(--pri-l);border-color:var(--pri);font-weight:600;font-size:16.5px}
/* Auswertung */
.score{font-size:52px;font-weight:900;text-align:center;margin:14px 0 2px}
.center{text-align:center}
/* ---------- Sprechen ---------- */
.mic{width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(180deg,#ff7a92,var(--red));border-bottom:7px solid var(--red-d);color:#fff;font-size:40px;cursor:pointer;margin:16px auto;display:block;transition:.1s}
.mic:active{transform:translateY(4px);border-bottom-width:3px}
.mic.rec{animation:pulse2 .9s infinite;background:linear-gradient(180deg,#ff5c7a,#e04261)}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(255,92,122,.5)}50%{box-shadow:0 0 0 16px rgba(255,92,122,0)}}
.sayline{font-size:17px;font-weight:700;background:var(--pri-l);border-radius:14px 14px 14px 4px;padding:13px 16px;margin:10px 0;display:inline-block;max-width:85%}
.sayline.me{background:#e9fbf1;border-radius:14px 14px 4px 14px;float:right;text-align:right}
.ttsbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 11px;font-size:16px;cursor:pointer}
/* ---------- Chat ---------- */
#fab{position:fixed;right:20px;bottom:24px;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(145deg,#7c5cff,#00d1b2);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(124,92,255,.45);z-index:60;transition:.12s transform}
#fab:hover{transform:scale(1.07)}
@media(max-width:900px){#fab{bottom:82px}}
#chat{position:fixed;right:16px;bottom:96px;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100vh - 130px));background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(30,32,60,.28);z-index:70;display:flex;flex-direction:column;overflow:hidden}
#chat .chead{background:linear-gradient(135deg,#7c5cff,#00d1b2);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
#chat .chead .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;overflow:hidden;flex:none}
#chat .chead b{display:block;font-size:15px} #chat .chead small{opacity:.85;font-size:11.5px}
#chat .chead button{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:17px;width:30px;height:30px;border-radius:9px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:13px;background:#f7f8fd;display:flex;flex-direction:column;gap:9px}
.msg{max-width:86%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.5;animation:pop .15s;white-space:pre-wrap}
.msg.bot{background:var(--card);border:1.5px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg.sys{background:#fff3dd;border:1.5px dashed var(--amber);color:#8a5b00;font-size:13px;align-self:center;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0;background:#f7f8fd}
.quick button{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--pri-d);cursor:pointer}
.quick button:hover{border-color:var(--pri)}
.cinput{display:flex;gap:8px;padding:10px;background:#f7f8fd;border-top:1px solid var(--line)}
.cinput input{flex:1;border:2px solid var(--line);border-radius:13px;padding:11px 13px;font-size:14.5px;outline:none;background:#fff}
.cinput input:focus{border-color:var(--pri)}
.cinput button{border:0;border-radius:13px;background:var(--pri);color:#fff;font-size:17px;width:46px;cursor:pointer}
/* ---------- Modal / Toast ---------- */
#modal{position:fixed;inset:0;background:rgba(20,22,40,.55);z-index:90;display:grid;place-items:center;padding:16px}
#modalbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;animation:pop .18s}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mbtns .btn{flex:1 1 auto;text-align:center;text-decoration:none;white-space:nowrap}
.mbtns .btn:first-child{flex-basis:100%}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:#24263a;color:#fff;padding:12px 20px;border-radius:13px;font-weight:700;font-size:14px;z-index:120;opacity:0;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Onboarding ---------- */
.obwrap{max-width:620px;margin:0 auto;padding-top:4vh}
.obstep{display:none} .obstep.on{display:block;animation:pop .2s}
.obdots{display:flex;gap:7px;justify-content:center;margin:16px 0}
.obdots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.2s}
.obdots i.on{background:var(--pri);width:26px;border-radius:99px}
.choice{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:15px;padding:15px;font-size:15.5px;font-weight:700;margin-top:11px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.choice:hover{border-color:var(--pri);background:var(--pri-l)}
.choice.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.bigemoji{font-size:54px;text-align:center;display:block;margin-bottom:6px}
/* ---------- Sonstiges ---------- */
.listrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer}
.listrow:hover{border-color:var(--pri)}
.listrow .emo{font-size:25px;flex:none}
.listrow b{display:block;font-size:15px} .listrow small{color:var(--mut)}
.listrow .go{margin-left:auto;color:var(--mut);font-size:18px}
.tag{display:inline-block;background:var(--pri-l);color:var(--pri-d);font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0}
.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:200;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.streakflame{display:inline-block;animation:flick 1.4s infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.14) rotate(3deg)}}
textarea.ta{width:100%;min-height:90px;border:2px solid var(--line);border-radius:13px;padding:12px;font-family:inherit;font-size:14.5px;outline:none;resize:vertical}
input.fi,select.fi{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px 13px;font-size:15px;outline:none;background:#fff;margin-top:7px}
input.fi:focus,select.fi:focus,textarea.ta:focus{border-color:var(--pri)}
label.fl{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.kbd{background:#eef0fa;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;font-family:monospace}
pre.code{background:#1d2136;color:#dfe4ff;border-radius:13px;padding:14px;overflow-x:auto;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
/* ---------- Eingabefelder: immer klick- & tippbar ---------- */
.gapin,.freein,input.fi,select.fi,textarea.ta,.cinput input{-webkit-user-select:text;user-select:text;cursor:text;pointer-events:auto;color:var(--ink)}
.gapin{min-height:38px;padding:6px 10px;font-family:inherit}
.freein{min-height:50px;font-family:inherit}
textarea.ta{background:var(--card)}
.ok-box,.bad-box{border-radius:12px;padding:10px;border:1.5px solid}
.ok-box{background:rgba(46,204,113,.14);border-color:var(--green)}
.bad-box{background:rgba(255,92,122,.14);border-color:var(--red)}
/* ---------- Gesperrte Themen ---------- */
.nbtn:disabled{cursor:not-allowed;opacity:.55;filter:grayscale(.7)}
.nbtn:disabled:hover{transform:none}
/* ---------- Akku (statt Herzen) ---------- */
.chip.hearts{color:var(--ink)}
.batt{display:inline-flex;align-items:center;vertical-align:middle}
.batt .cells{display:inline-flex;gap:2px;padding:2px;border:2px solid currentColor;border-radius:5px}
.batt .cells i{width:7px;height:13px;border-radius:2px;background:rgba(128,134,160,.28)}

<script>
"use strict";
/* =========================================================================
   LERNHUB – eine Datei, keine externen Abhängigkeiten, funktioniert offline.
   Aufbau:  1) Konstanten & Speicher   2) Lerndaten (BASE) + Agenten-Erweiterung
            3) Zustand/Utils           4) Onboarding  5) Home & Lernpfad
            6) Lektions-Engine         7) Wiederholen  8) Sprachen/Sprechen/Call
            9) Charaktere  10) KI-Chat  11) Agent-Panel  12) Einstellungen/Recht
   Ausführliche Doku: README.md (Ordner lernhub) – auch für KI-Prüfer gedacht.
   ========================================================================= */
const LS_KEY = "lernhub_state_v1";
/* ===================== 1) KONSTANTEN & SPEICHER ===================== */
const SCHULEN = [
  "Gewerbliche Schulen Villingen-Schwenningen (GSVS)",
  "Gewerbliche Schulen VS – Standort Villingen",
  "Gewerbliche Schulen VS – Standort Schwenningen"
];
const KLASSEN = ["E1FI A","E1FI B","E1FI C","E2FI A","BFI 1","BFI 2"];
const VID_BASIS = "https://www.youtube.com/results?search_query="; /* nur Links, keine eingebetteten Videos */

function defaultState(){
  return Object.assign({
    v:1, seenOnboard:false,
    profile:{name:"", school:SCHULEN[0], klasse:"E1FI A", goal:"schule", langs:["Englisch"],
             style:{sehen:50,hören:50,tun:50}, daily:20, hearts:true, theme:"dark", skipOnboard:false},
    xp:0, streak:{n:0,last:"",best:0}, hearts:{v:5,day:"",t:0},
    progress:{},               /* topicId -> {lessons, done, wrong:{key:count}} */
    review:[],                 /* {tid,kind,idx,fails,due} */
    chars:[], activeChar:null,
    chat:{apiKey:"",endpoint:"https://api.openai.com/v1/chat/completions",model:"gpt-4o-mini"},
    agent:{lastPing:0,connected:false,vaultPath:"",schoolUrl:"https://www.gewerbeschule-vs.de/"},
    videos:{seen:0,lastTopic:"",lastDay:""},
    custom:{subjects:[]},      /* eigene Fächer (allgemeines Lernen) */
    stats:{answered:0,correct:0,lessons:0,hints:0}
  }, plusDefaults(), extraDefaults());
}
/* ---- Bereinigung fremder/gespeicherter Daten (Agent-Erweiterungen, Backups, eigene Fächer) ---- */
function str(x,max){ return typeof x==="string" ? x.slice(0,max||2000) : ""; }
function safeId(x){ return typeof x==="string" && /^[A-Za-z0-9_-]{1,60}$/.test(x); }
function strList(a){ return Array.isArray(a) ? a.filter(x=>typeof x==="string" && x.trim()).map(x=>x.slice(0,300)) : []; }
function cleanTopic(t){
  if(!t || typeof t!=="object" || !safeId(t.id)) return null;
  const L = a => Array.isArray(a) ? a.filter(x=>x && typeof x==="object") : [];
  const o = {id:t.id, name:str(t.name,120)||t.id};
  o.mc = L(t.mc).filter(q=>typeof q.q==="string" && Array.isArray(q.c) && q.c.length>=2 && q.c.length<=8 && q.c.every(c=>typeof c==="string") && Number.isInteger(q.a) && q.a>=0 && q.a<q.c.length)
    .map(q=>({q:q.q.slice(0,500), c:q.c.map(c=>c.slice(0,300)), a:q.a, w:str(q.w,600)}));
  o.cards = L(t.cards).filter(c=>typeof c.f==="string" && typeof c.b==="string").map(c=>({f:c.f.slice(0,300), b:c.b.slice(0,800)}));
  o.gaps = L(t.gaps).filter(g=>typeof g.t==="string" && g.t.includes("___") && strList(g.a).length).map(g=>({t:g.t.slice(0,500), a:strList(g.a)}));
  o.free = L(t.free).filter(f=>typeof f.q==="string" && strList(f.a).length).map(f=>({q:f.q.slice(0,500), a:strList(f.a), w:str(f.w,600)}));
  return (o.mc.length+o.cards.length+o.gaps.length+o.free.length) ? o : null;
}
function cleanSubject(s){
  if(!s || typeof s!=="object" || !safeId(s.id) || !Array.isArray(s.topics)) return null;
  const topics = s.topics.map(cleanTopic).filter(Boolean);
  if(!topics.length) return null;
  const o = {id:s.id, name:str(s.name,60)||s.id, color:/^#[0-9a-f]{6}$/i.test(s.color||"")?s.color:"#7c5cff", topics};
  if(/^[a-z]{2}-[A-Z]{2}$/.test(s.lang||"")) o.lang=s.lang;
  return o;
}
function cleanChar(c){
  const num=(v,lo,hi,d)=>{ v=+v; return isFinite(v)?Math.min(hi,Math.max(lo,v)):d; };
  c = (c && typeof c==="object") ? c : {};
  const t = (c.traits && typeof c.traits==="object") ? c.traits : {};
  return {
    id: (typeof c.id==="string" && /^[\w-]{1,40}$/.test(c.id)) ? c.id : "c"+Date.now()+Math.floor(Math.random()*1000),
    name: str(c.name,40) || "Coach",
    emoji: str(c.emoji,8).replace(/[<>&"'`\\]/g,"") || "🦉",
    img: (typeof c.img==="string" && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(c.img)) ? c.img : "",
    traits: {freundlich:num(t.freundlich,0,100,50), ernst:num(t.ernst,0,100,50), chaos:num(t.chaos,0,100,30), motivation:num(t.motivation,0,100,50)},
    voicePitch: num(c.voicePitch,0.5,2,1), voiceRate: num(c.voiceRate,0.5,2,1),
    color: /^#[0-9a-f]{6}$/i.test(c.color||"") ? c.color : "#7c5cff",
    blurb: str(c.blurb,200),
    face: FACE_IDS.includes(c.face) ? c.face : "",
    sex: c.sex==="f" || c.sex==="m" ? c.sex : "",
    voiceName: str(c.voiceName,100)
  };
}
/* Zustand zusammenführen + Typen absichern (kaputte/importierte Daten dürfen die App nicht lahmlegen) */
function sanitizeState(raw){
  const D = defaultState();
  const isObj = o => o && typeof o=="object" && !Array.isArray(o);
  /* "__proto__"/"constructor" aus Importen/Cloud verwerfen, sonst ändert Object.assign den Prototyp */
  if(isObj(raw)) raw = JSON.parse(JSON.stringify(raw), (k,v)=> k==="__proto__"||k==="constructor" ? undefined : v);
  const st = Object.assign({}, D, isObj(raw)?raw:{});
  if(!Array.isArray(st.chars)) st.chars=[];
  ["profile","streak","hearts","progress","chat","agent","videos","custom","stats"].forEach(k=>{
    st[k] = Object.assign({}, D[k], isObj(st[k])?st[k]:{});
  });
  st.profile.style = Object.assign({}, D.profile.style, isObj(st.profile.style)?st.profile.style:{});
  if(!Array.isArray(st.profile.langs)) st.profile.langs = D.profile.langs.slice();
  st.profile.langs = st.profile.langs.filter(x=>typeof x=="string");
  ["name","school","klasse","goal"].forEach(k=>{ if(typeof st.profile[k]!=="string") st.profile[k]=D.profile[k]; });
  st.profile.daily = Math.max(5, Math.min(500, +st.profile.daily || 20));
  st.profile.hearts = st.profile.hearts!==false;
  st.profile.theme = st.profile.theme==="light" ? "light" : "dark";
  st.xp = Math.max(0, +st.xp || 0);
  st.streak.n = Math.max(0, +st.streak.n || 0); st.streak.best = Math.max(0, +st.streak.best || 0);
  st.hearts.v = Math.max(0, Math.min(5, +st.hearts.v || 0));
  st.hearts.t = Math.max(0, +st.hearts.t || 0);
  st.stats.hints = Math.max(0, +st.stats.hints || 0);
  if(!Array.isArray(st.review)) st.review=[];
  st.review = st.review.filter(r=>isObj(r) && typeof r.tid=="string" && typeof r.kind=="string" && Number.isInteger(r.idx));
  st.review.forEach(r=>{ r.fails=+r.fails||1; if(typeof r.due!=="string") r.due=today(); });
  st.chars = st.chars.filter(isObj).map(cleanChar);
  if(st.activeChar && !st.chars.some(c=>c.id===st.activeChar) && !castById(st.activeChar)) st.activeChar = null;
  st.custom.subjects = (Array.isArray(st.custom.subjects)?st.custom.subjects:[]).map(cleanSubject).filter(Boolean);
  ["vaultPath","schoolUrl"].forEach(k=>{ if(typeof st.agent[k]!=="string") st.agent[k]=D.agent[k]; });
  st.agent.connected = false;       /* wird beim Start per Ping neu ermittelt */
  st.agent.full = false;
  st.authAsked = !!st.authAsked;    /* Anmelde-Bildschirm beim Start schon gesehen */
  if(typeof st.chat.apiKey!=="string") st.chat.apiKey="";
  if(typeof st.chat.endpoint!=="string") st.chat.endpoint=D.chat.endpoint;
  if(typeof st.chat.model!=="string") st.chat.model=D.chat.model;
  sanitizePlus(st);
  sanitizeExtra(st);
  st.seenOnboard = !!st.seenOnboard;
  st.seenTour = !!st.seenTour;
  return st;
}
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    return sanitizeState(JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Speichern fehlgeschlagen (Speicher voll?)"); } if(window.cloudPushSoon) cloudPushSoon(); if(window.statePushSoon) statePushSoon(); if(window.extraAfterSave) extraAfterSave(); }
function resetAll(){ if(confirm("Wirklich ALLES zurücksetzen? Fortschritt, Streak, XP und Charaktere gehen verloren.")){ localStorage.removeItem(LS_KEY); location.reload(); } }

/* ===================== Utils ===================== */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){
  return String(s).toLowerCase()
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, d => "0123456789"["⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(d)])
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
    .replace(/ue/g,"u").replace(/oe/g,"o").replace(/ae/g,"a")
    .replace(/ı/g,"i").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9µ]+/g,"");
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* Lokales Datum (nicht UTC!) als YYYY-MM-DD, optional mit Tages-Offset */
function dayStr(offset){ const d=new Date(); d.setDate(d.getDate()+(offset||0)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dayStr(0); }
/* Montag der aktuellen Woche (lokal) als YYYY-MM-DD */
function weekStartStr(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayDiff(a,b){ return Math.round((new Date(a+"T00:00") - new Date(b+"T00:00"))/86400000); }
function toast(msg, ms){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms||2400); }
function confetti(n){
  const cols=["#7c5cff","#00d1b2","#2ecc71","#ffb020","#ff5c7a","#3fa9f5"];
  for(let i=0;i<(n||40);i++){
    const d=document.createElement("i"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.4)+"s"; d.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600);
  }
}
function toastModal(html){ $("modalbox").innerHTML=html; $("modal").classList.remove("hidden","sheetmode"); }
function closeModal(){ $("modal").classList.add("hidden"); }
function applyTheme(){ document.body.classList.toggle("dark", (S.profile&&S.profile.theme)!=="light"); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast("In die Zwischenablage kopiert ✓"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Kopiert ✓"); }catch(_){ toast("Kopieren nicht möglich – Text manuell markieren"); }
    ta.remove();
  }
}
/* ---- Statistik/Streak/Herzen/XP ---- */
function addXP(n){
  S.xp+=n;
  if(S.stats.todayDay!==today()){ S.stats.todayDay=today(); S.stats.todayXP=0; }
  S.stats.todayXP=(S.stats.todayXP||0)+n;
  if(S.stats.weekDay!==weekStartStr()){ S.stats.weekDay=weekStartStr(); S.stats.weekXP=0; }
  S.stats.weekXP=(S.stats.weekXP||0)+n;
  save(); renderTop();
}
function levelOf(xp){ return Math.floor(Math.sqrt(xp/50))+1; }  /* sanft steigende Level */
function xpForLevel(l){ return 50*(l-1)*(l-1); }
function touchStreak(){
  const t=today();
  if(S.streak.last===t) return;
  streakRepair();                 /* Freeze/Ruhetage zuerst anrechnen, sonst würde die Serie neu starten */
  S.streak.n = (S.streak.last===dayStr(-1)) ? S.streak.n+1 : 1;
  S.streak.last=t; S.streak.best=Math.max(S.streak.best,S.streak.n); save(); renderTop();
}
/* Angezeigte Serie: ist sie gestern gerissen, zeigt die App 0 */
function streakNow(){ return (S.streak.last===today()||S.streak.last===dayStr(-1)) ? S.streak.n : 0; }
/* Akku wie bei Duolingo: alle BATT_MIN Minuten lädt eine Zelle nach; neuer Tag = voll (Comeback-Bonus). */
const BATT_MIN = 20;
function heartsRefill(){
  const now=Date.now(), h=S.hearts;
  if(h.day!==today()){ const fresh=h.day!=="" && h.v<5; S.hearts={v:5,day:today(),t:now}; save(); if(fresh) setTimeout(()=>toast("🔋 Neuer Tag – Akku wieder voll geladen!"),600); return; }
  if(h.v>=5){ h.t=now; return; }
  if(!h.t) h.t=now;
  const gain=Math.floor((now-h.t)/(BATT_MIN*60000));
  if(gain>0){ h.v=Math.min(5,h.v+gain); h.t = h.v>=5 ? now : h.t+gain*BATT_MIN*60000; save(); }
}
/* Millisekunden bis zur nächsten Zelle (0 = voll) */
function battNextIn(){ const h=S.hearts; return (h.v>=5||!h.t) ? 0 : Math.max(0, h.t+BATT_MIN*60000-Date.now()); }
function fmtMin(ms){ const m=Math.max(1,Math.ceil(ms/60000)); return m<60 ? m+" Min" : Math.floor(m/60)+" Std "+(m%60)+" Min"; }
/* Akku (5 Zellen) statt Herzen – State bleibt S.hearts / S.profile.hearts */
function battHTML(v){
  v=Math.max(0,Math.min(5,+v||0));
  const lvl=v<=1?"low":v<=3?"mid":"ok";
  return `<span class="batt ${lvl}" role="img" aria-label="Akku ${v} von 5" title="Akku ${v}/5"><span class="cells">${[0,1,2,3,4].map(i=>`<i class="${i<v?"on":""}"></i>`).join("")}</span><span class="tip"></span></span>`;
}
function loseHeart(){
  if(!S.profile.hearts) return;
  heartsRefill(); if(S.hearts.v>0){ if(S.hearts.v>=5) S.hearts.t=Date.now(); S.hearts.v--; save(); renderTop(); }
}
function dayGoalPct(){
  const done = todayXP();
  return Math.min(100, Math.round(100*done/(S.profile.daily||20)));
}
function addTodayXP(n){ /* bleibt aus Kompatibilitätsgründen leer – addXP() zählt das Tagesziel bereits mit */ }
function todayXP(){ return S.stats.todayDay===today() ? (S.stats.todayXP||0) : 0; }

/* ---------------- Agenten-Erweiterungen einbinden (content/erweiterungen.js) ---------------- */
/* Regeln: Agent darf nur ANHÄNGEN (stabile Indizes für die Wiederholung). Alles wird validiert/bereinigt. */
const EXT_TOPIC_IDS = new Set(), EXT_TERMINE = [];
function applyExt(){
  const E = window.LERNHUB_EXT;
  if(!E || typeof E!=="object") return;
  try{
    (Array.isArray(E.subjects)?E.subjects:[]).forEach(raw=>{
      const s = cleanSubject(raw); if(!s) return;
      const cur = DATA[s.id];
      if(!cur){ DATA[s.id]=s; s.topics.forEach(t=>EXT_TOPIC_IDS.add(t.id)); return; }
      s.topics.forEach(t=>{
        const i = cur.topics.findIndex(x=>x.id===t.id);
        if(i<0){ cur.topics.push(t); EXT_TOPIC_IDS.add(t.id); }
        else if(EXT_TOPIC_IDS.has(t.id)) cur.topics[i]=t;     /* nur Agent-Themen dürfen aktualisiert werden, nie eingebaute */
      });
    });
    if(E.sprachen && typeof E.sprachen==="object") Object.keys(E.sprachen).slice(0,12).forEach(k=>{
      const x=E.sprachen[k]; if(!x || typeof x!=="object" || !str(k,30)) return;
      const p = SPRACHEN[k] = SPRACHEN[k] || {flag:"🗣️", lang:"en-US", vok:[], calls:[]};
      if(str(x.flag,8) && !/[<>&"'`]/.test(x.flag)) p.flag=x.flag;
      if(/^[a-z]{2}-[A-Z]{2}$/.test(x.lang||"")) p.lang=x.lang;
      p.vok = p.vok||[]; p.calls = p.calls||[];
      (Array.isArray(x.vok)?x.vok:[]).forEach(v=>{
        if(v && typeof v.de==="string" && typeof v.en==="string" && v.de.trim() && v.en.trim() && !p.vok.some(o=>o.de===v.de&&o.en===v.en)) p.vok.push({de:v.de.slice(0,200), en:v.en.slice(0,200)});
      });
      (Array.isArray(x.calls)?x.calls:[]).forEach(c=>{
        if(!c || typeof c.title!=="string" || !Array.isArray(c.lines) || p.calls.some(o=>o.title===c.title)) return;
        const lines=c.lines.filter(l=>l && typeof l.bot==="string" && strList(l.expect).length).map(l=>({bot:l.bot.slice(0,300), expect:strList(l.expect)}));
        if(lines.length) p.calls.push({title:c.title.slice(0,80), lines});
      });
    });
    strList(E.schulen).forEach(s=>{ s=s.slice(0,100); if(SCHULEN.indexOf(s)<0) SCHULEN.push(s); });
    EXT_TERMINE.length=0;
    (Array.isArray(E.termine)?E.termine:[]).forEach(t=>{
      if(t && /^\d{4}-\d{2}-\d{2}$/.test(t.datum||"") && typeof t.titel==="string") EXT_TERMINE.push({datum:t.datum, titel:t.titel.slice(0,120), fach:str(t.fach,40)});
    });
  }catch(e){ console.warn("Erweiterung nicht lesbar:", e); }
}

const LESSONS_TO_UNLOCK = 1;
function topicState(subjId, idx){

/* ===================== 7) LEKTIONS-ENGINE ===================== */
let LES=null;
function kindWeight(kind){
  const st=S.profile.style||{}; let w=1;
  if(kind==="mc")   w += (st.sehen||0)/160 + (st.hören||0)/300;
  if(kind==="card") w += (st.sehen||0)/220 + (st.hören||0)/160;
  if(kind==="gap")  w += (st.tun||0)/140;
  if(kind==="free") w += (st.tun||0)/170;
  return w;
}
/* Freitext-Fragen gibt es erst in der Probeprüfung */
function buildItems(tp, n){
  const pool=[];
  ["mc","card","gap"].forEach(k=>{ (tp[k]||[]).forEach((_,i)=>pool.push({kind:k,idx:i,w:kindWeight(k)})); });
  pool.forEach(p=>p.key=Math.pow(Math.random(),1/p.w));     /* gewichtetes Mischen */
  pool.sort((a,b)=>b.key-a.key);
  return pool.slice(0, Math.min(n||8, pool.length)).map(({kind,idx})=>({kind,idx}));
}
function startLesson(subjId, tid, mode){
  const subj=subjById(subjId); if(!subj) return go("home");
  const tp=subj.topics.find(t=>t.id===tid); if(!tp) return go("home");
  if(mode!=="review" && topicState(subjId, subj.topics.indexOf(tp))==="lock") return toast("🔒 Gesperrt – schließe zuerst das vorherige Thema ab");
  heartsRefill();
  if(S.profile.hearts && S.hearts.v<=0){ V.view="lesson"; LES={outOfHearts:true}; return renderLesson(); }
  LES={mode:mode||"lesson", subjId, tid, items:buildItems(tp, mode==="review"?6:8).map(o=>({kind:o.kind, idx:o.idx, tid})), i:0, ok:0, wrong:[], xp:0, flipped:false, checked:false};
  V.view="lesson"; window.scrollTo(0,0); renderLesson();
}
function examPool(subjId){
  const subj=subjById(subjId), free=[], rest=[];
  if(subj) subj.topics.forEach((tp,i)=>{
    if(topicState(subjId,i)==="lock") return;
    (tp.free||[]).forEach((_,idx)=>free.push({kind:"free",idx,tid:tp.id}));
    ["mc","card","gap"].forEach(k=>(tp[{mc:"mc",card:"cards",gap:"gaps"}[k]]||[]).forEach((_,idx)=>rest.push({kind:k,idx,tid:tp.id})));
  });
  return {free, rest};
}
function startExam(subjId){
  const {free, rest}=examPool(subjId);
  if(!free.length && !rest.length) return toast("Noch keine Aufgaben für eine Probeprüfung");
  heartsRefill();
  if(S.profile.hearts && S.hearts.v<=0){ V.view="lesson"; LES={outOfHearts:true}; return renderLesson(); }
  const f=shuffle(free).slice(0,4), items=shuffle(f.concat(shuffle(rest).slice(0,12-f.length)));
  LES={mode:"exam", subjId, tid:null, items, i:0, ok:0, wrong:[], xp:0, flipped:false, checked:false};
  V.view="lesson"; window.scrollTo(0,0); renderLesson();
}
function startReview(){

  if(!due.length){ toast("Alles aufgeholt – perfect! 🎉"); return; }
  const items=shuffle(due).slice(0,10).map(r=>({kind:r.kind, idx:r.idx, tid:r.tid}));

  LES={mode:"review", items, i:0, ok:0, wrong:[], xp:0, subjId:null, tid:null, flipped:false, checked:false};

function curItem(){ return LES.items[LES.i]; }
function topicById(tid){ const sid=subjectOfTopic(tid); const s=sid?subjById(sid):null; return s?(s.topics.find(t=>t.id===tid)||null):null; }
/* Sprache für Vorlesen: Fach-Attribut lang, sonst Berufsenglisch=en-US, sonst Deutsch */
function langOfTopic(tp){ const sid=tp?subjectOfTopic(tp.id):null; const s=sid?subjById(sid):null; return (s&&s.lang)||(sid==="BE"?"en-US":"de-DE"); }
/* Wiederholungs-Einträge entfernen, deren Thema/Aufgabe nicht mehr existiert */
function pruneReview(){
  const key={mc:"mc",card:"cards",gap:"gaps",free:"free"};
  const n=S.review.length;
  S.review=S.review.filter(r=>{ const tp=topicById(r.tid); return r.kind!=="free" && tp && key[r.kind] && tp[key[r.kind]] && tp[key[r.kind]][r.idx]; });
  if(S.review.length!==n) save();
}
function curTP(){
  const it=curItem();
  if(!it || !it.tid) return null;

  return s ? (s.topics.find(t=>t.id===it.tid)||null) : null;
}
function subjectOfTopic(tid){
  for(const id of allSubjectIds()){ const s=subjById(id); if(s && s.topics.some(t=>t.id===tid)) return id; }
  return null;

function renderLesson(){
  if(LES.outOfHearts) return renderNoHearts();
  if(LES.i>=LES.items.length) return renderLessonDone();
  const it=curItem(), tp=curTP();
  if(!it || !tp){ LES=null; return go("home"); }
  const srcKey={mc:"mc",card:"cards",gap:"gaps",free:"free"}[it.kind];
  if(!srcKey || !tp[srcKey] || !tp[srcKey][it.idx]){ LES.i++; return renderLesson(); }   /* Aufgabe existiert nicht mehr */
  const pct=Math.round(100*LES.i/LES.items.length);
  const hearts = S.profile.hearts ? battHTML(S.hearts.v) : "🔋 ∞";
  const head=`<div class="lessonhead">
    <button class="xbtn" onclick="quitLesson()" title="Beenden">✕</button>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span style="font-weight:800">${hearts}</span>
    <span style="font-weight:800;color:var(--pri)">+${LES.xp}⚡</span></div>`;
  let body="";
  if(it.kind==="mc"){ const q=tp.mc[it.idx]; if(!it.perm) it.perm=shuffle(q.c.map((_,i)=>i)); body=viewMc(q,it.perm); }
  if(it.kind==="card")  body=viewCard(tp.cards[it.idx]);
  if(it.kind==="gap")   body=viewGap(tp.gaps[it.idx]);
  if(it.kind==="free")  body=viewFree(tp.free[it.idx]);
  const sub = (it.retry ? "🔁 Nochmal – das war falsch · " : "") + (LES.mode==="review" ? "🔁 Wiederholung" : LES.mode==="exam" ? "📝 Probeprüfung · "+esc(tp.name) : esc(tp.name));
  $("app").innerHTML = `${head}<p class="small mut" style="margin:0 0 8px">${sub} · Frage ${LES.i+1}/${LES.items.length}</p>${body}`;
  if(it.kind==="gap" && !LES.checked){ const f=$("g0"); if(f) f.focus(); }
  if(it.kind==="free" && !LES.checked){ const f=$("fin"); if(f) f.focus(); }
}
/* --- Aufgabenarten --- */
/* Antwortreihenfolge wird pro Aufgabe zufällig gemischt (perm = Anzeige-Position -> Original-Index) */
function viewMc(q, perm){
  const right = perm.indexOf(q.a);
  const opts=perm.map((orig,i)=>{
    let cls="opt";
    if(LES.checked){ if(i===right) cls+=" correct"; else if(i===LES.picked) cls+=" wrong"; }
    return `<button class="${cls}" ${LES.checked?"disabled":""} onclick="answerMc(${i})">${esc(q.c[orig])}</button>`;
  }).join("");
  const fb = LES.checked ? feedbackHTML(LES.picked===right, esc(q.w||""), "Weiter") : "";
  return `<div class="qcard"><div class="qtext">${esc(q.q)}</div>${opts}${fb}</div>
    ${LES.checked||!agentOn()?"":`<div class="center"><button class="btn ghost sm" onclick="askHint()">✨ Tipp</button></div>`}`;
}
function answerMc(i){
  if(LES.checked) return;
  const tp=curTP(); if(!tp) return;
  const it=curItem(), q=tp.mc[it.idx];

function answerCard(ok){

/* Lückentext: ein Blank + mehrere Antworten = Alternativen; sonst je Blank eine Antwort */
function gapSpec(g){
  const n=Math.max(0,String(g.t).split("___").length-1), a=g.a||[];
  if(n===a.length) return a.map(x=>[x]);
  if(n===1) return [a];
  return Array.from({length:n},(_,i)=>[a[i]!==undefined?a[i]:""]);
}
function viewGap(g){
  const parts=g.t.split("___"); let inputs="";
  parts.forEach((p,i)=>{ inputs+=esc(p); if(i<parts.length-1) inputs+=`<input class="gapin" id="g${i}" autocomplete="off" ${LES.checked?"disabled":""} placeholder="…" onkeydown="if(event.key==='Enter')answerGap()">`; });
  let fb="";

    fb = feedbackHTML(allOk, allOk? "Super!" : "Lösung: "+gapSpec(g).map(x=>esc(x[0])).join(" · "), "Weiter");
  } else fb = `<button class="btn" onclick="answerGap()">Prüfen</button>`;
  const html=`<div class="qcard"><div class="qtext">Lücke füllen</div><div class="gapline">${inputs}</div>${fb}</div>`;
  return html;
}
function answerGap(){
  if(LES.checked) return;
  const tp=curTP(); if(!tp) return;
  const g=tp.gaps[curItem().idx];
  const spec=gapSpec(g);
  LES.gapOk=spec.map((alts,i)=>{ const el=$("g"+i); if(!el) return false; const v=norm(el.value); return !!v && alts.some(a=>norm(a)===v); });
  const allOk=LES.gapOk.every(Boolean);
  LES.checked=true;
  if(allOk){ correct(); } else { wrong(curItem(), "Lösung: "+spec.map(x=>x[0]).join(" · ")); }
  renderLesson();
  if(LES.checked){ (LES.gapOk||[]).forEach((ok,i)=>{ const el=$("g"+i); if(el) el.classList.add(ok?"ok":"bad"); }); }
}

function freeMatch(val, na){
  if(!val || !na) return false;
  if(val===na) return true;
  if(na.length<=3) return false;
  if(val.includes(na)) return true;
  return val.length>=4 && val.length>=na.length*0.6 && na.includes(val);

function wrong(item, expl){

function ttsVoice(lang){

function speak(text, lang){

    const c=activeChar();
    if(c && c.voicePitch){ u.pitch=c.voicePitch; u.rate=c.voiceRate||1; }

}

function sttStart(lang, onResult, onEnd){

  const r=new SR(); r.lang=lang||"en-US"; r.interimResults=false; r.maxAlternatives=3;
  r.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript); onResult(alts); };

  r.onend=()=>onEnd(null);

  return r;
}

function speakMatch(g, e){
  if(!g || !e) return false;
  if(g===e) return true;
  if(g.includes(e) && g.length<=e.length*2+3) return true;
  if(e.includes(g) && g.length>=e.length*0.7) return true;
  return e.length>4 && similarity(g,e)>0.72;

function doSpeak(){

    if(finished||!SPK) return; finished=true;
    SPK.listening=false;
    if(got==null){ SPK.result={ok:false,got:""}; loseHeart(); return renderSpeak(); }
    const ok = got.some(x=>speakMatch(norm(x), norm(expected)));
    if(ok) SPK.ok++;

    addXP(ok?5:1); S.stats.answered++; if(ok)S.stats.correct++;

function similarity(a,b){
  if(!a||!b) return 0;
  const m=Math.max(a.length,b.length); if(!m) return 1;
  const d=lev(a,b); return 1-d/m;

function lev(a,b){
  const dp=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[a.length][b.length];

/* Stichwort-Treffer auf Wortebene ("no" trifft nicht "not"); längere Stichwörter dürfen Endungen haben ("thank" → "thanks") */
function wordsOf(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/['’`´]/g,"").replace(/[^a-z0-9ß]+/g," ").trim().split(" ").filter(Boolean);
}
function callHits(line, said){
  const sw=wordsOf(said); if(!sw.length) return 0;
  const joined=" "+sw.join(" ")+" ";
  return line.expect.filter(e=>{
    const ew=wordsOf(e); if(!ew.length) return false;
    if(ew.length>1) return joined.includes(" "+ew.join(" ")+" ");
    return sw.some(w=>w===ew[0] || (ew[0].length>=4 && w.startsWith(ew[0])));
  }).length;
}
function doCallSpeak(){
  if(!CALL||CALL.listening) return;
  CALL.listening=true; renderCall();
  let finished=false;
  const finish=(said)=>{
    if(finished||!CALL) return; finished=true;
    CALL.listening=false;
    if(said==null){ CALL.feedback={ok:false,text:"Nicht verstanden – bitte nochmal oder tippen."}; return renderCall(); }
    processCallAnswer(said);
  };
  sttStart(packLang(CALL.pack), alts=>finish(alts[0]||""), ()=>finish(null));
}
function checkCallTyped(){
  const el=$("callIn"); if(!el||!el.value.trim()) return;
  processCallAnswer(el.value);
}
function processCallAnswer(said){
  const call=SPRACHEN[CALL.pack].calls[CALL.idx], line=call.lines[CALL.line];
  CALL.transcript=said;
  const hits=callHits(line, said);
  CALL.tries=(CALL.tries||0)+1;
  const ok = hits>=1 || CALL.tries>=3;      /* ein passendes Stichwort reicht; nach 3 Versuchen hilft der Charakter weiter */
  if(ok){
    CALL.okLines=(CALL.okLines||0)+1;
    CALL.feedback={ok:true, text: (CALL.tries<=1 && hits>=2) ?"Perfect – so klingt flüssiges Sprechen! 🎉":CALL.tries<=1?"Ja, so passt's! 🎉":"Geschafft – weiter geht's! ✅"};
    addXP(10);
  }else{
    CALL.feedback={ok:false, text:`Hmm – versuch z. B.: „${esc(line.expect[0])} …“ (erstes Stichwort)`};
    loseHeart();
  }
  save(); renderCall();
}

function ecFile(input){
  if(!input || !input.files || !input.files[0]){ EC.img=""; EC.color=""; EC.blurb=""; return renderCharEdit(); }

function analyzeImage(dataURL, cb){
  const img=new Image();
  img.onload=()=>{
    try{
      const cv=document.createElement("canvas"); cv.width=48; cv.height=48;
      const cx=cv.getContext("2d"); cx.drawImage(img,0,0,48,48);
      const d=cx.getImageData(0,0,48,48).data;
      let r=0,g=0,b=0,sat=0,n=0;
      for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2];
        const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]);
        sat += mx? (mx-mn)/mx : 0; n++; }
      r/=n; g/=n; b/=n; sat/=n;
      const bright=(r*.299+g*.587+b*.114)/255;
      const hue=rgbHue(r,g,b);
      const c=rgbHex(r,g,b);
      /* Lokale „Charakter-Auswertung“: Farbe + Sättigung + Helligkeit → Stimmung */
      const warm = (hue<70||hue>340);
      const calm = sat<0.25 || bright<0.35;
      EC.color=c;
      EC.traits.freundlich = Math.round(warm?75:(calm?45:60));
      EC.traits.ernst      = Math.round(bright<0.4?75:(calm?60:35));
      EC.traits.chaos      = Math.round(sat>0.5?80:(calm?20:45));
      EC.traits.motivation = Math.round(sat>0.4&&!calm?85:(warm?70:50));
      EC.voicePitch = Math.max(.7, Math.min(1.5, 1 + (0.5-bright)*0.5 + (warm?0.1:-0.05)));
      EC.voiceRate  = Math.max(.8, Math.min(1.3, 0.9 + (EC.traits.chaos/100)*0.35));
      EC.blurb = `Farbwelt ${warm?"warm":"kühl"}${sat>0.45?", kräftig gesättigt":""}${bright<0.4?" und dunkel":" und hell"} → ${EC.traits.motivation>65?"motivierend":EC.traits.ernst>65?"ruhig-seriös":"locker-freundlich"}`;
      /* Bild verkleinern (max. 256 px), damit der localStorage nicht vollläuft */
      let small="";
      try{
        const k=Math.min(1, 256/Math.max(img.width||256, img.height||256));
        const c2=document.createElement("canvas"); c2.width=Math.max(1,Math.round((img.width||256)*k)); c2.height=Math.max(1,Math.round((img.height||256)*k));
        c2.getContext("2d").drawImage(img,0,0,c2.width,c2.height);
        small=c2.toDataURL("image/jpeg",0.82);
      }catch(e){ small = dataURL.length<300000 ? dataURL : ""; }
      cb(small);
    }catch(e){ cb(dataURL.length<300000 ? dataURL : ""); }
  };
  img.onerror=()=>{ toast("Bild nicht lesbar"); cb(""); };
  img.src=dataURL;
}
function rgbHue(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(!d) return 0; let h; if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
  h*=60; return (h+360)%360; }
function rgbHex(r,g,b){ const f=v=>Math.round(v).toString(16).padStart(2,"0"); return "#"+f(r)+f(g)+f(b); }

function chatCtx(){
  /* Liefert den aktuellen Lernkontext: Frage, Thema, Fehlversuche */
  if(V.view==="lesson" && LES && !LES.outOfHearts && LES.i<LES.items.length){
    const it=curItem(); const tp=curTP(); const subj=subjById(subjectOfTopic(it.tid));
    const key=it.tid+it.kind+it.idx;
    const r=S.review.find(x=>x.tid===it.tid&&x.kind===it.kind&&x.idx===it.idx);
    let q="", correct="", expl="";
    if(it.kind==="mc"){ const q2=tp.mc[it.idx]; q=q2.q; correct=q2.c[q2.a]; expl=q2.w||""; }
    if(it.kind==="card"){ const c=tp.cards[it.idx]; q="Karte: "+c.f; correct=c.b; expl=c.b; }
    if(it.kind==="gap"){ const g=tp.gaps[it.idx]; q=g.t; correct=gapSpec(g).map(x=>x[0]).join(" / "); expl=""; }
    if(it.kind==="free"){ const f=tp.free[it.idx]; q=f.q; correct=f.a[0]; expl=f.w||""; }
    return {kind:it.kind, idx:it.idx, tid:it.tid, key, q, correct, expl,
            fails:(r?r.fails:0), topic:tp.name, subj:subj?subj.name:"", giveUp:S.chatGiveUp&&S.chatGiveUp[key]};

async function bridgeAsk(prompt, who, charId){
  if(AGENT_BUSY){ toast("Moment – die KI denkt noch nach …"); return ""; }
  AGENT_BUSY=true;
  loadOn("ai", `💭 ${who||activeChar().name} denkt nach …`, charId);

    let r=await post();
    if(r.status===403 && await loadToken()) r=await post();
    const j=await r.json();
    if(j.ok && j.id){
      const t0=Date.now();
      while(Date.now()-t0<150000){
        await new Promise(res=>setTimeout(res,2000));
        const s=await (await fetch(BRIDGE+"/tipp?id="+encodeURIComponent(j.id))).json();
        if(s.done){ out=s.text||""; break; }
        if(!s.ok) break;
      }
    }
  }catch(e){}
  AGENT_BUSY=false; loadOff("ai");
  return out;
}

function handleChat(raw){
  const t=norm(raw);
  const ctx=chatCtx();
  /* Hilfe-Absicht: Lösung nur ab Schwelle (t ist normalisiert: ohne Umlaute/Leerzeichen) */
  const wantsSolution = /losung|aufloesen|auflosen|ichgibsauf|aufgeben|zeigdieantwort|dieantwort|antwortzeigen/.test(t);
  if(wantsSolution && !ctx) return pushMsg("bot","Öffne zuerst eine Aufgabe – dann gebe ich dir Tipps dazu und, wenn du sie wirklich brauchst, auch die Lösung.");
  if(wantsSolution){
    if(ctx && (ctx.fails>=HINT_THRESHOLD || ctx.giveUp)) return chatSolution();
    return pushMsg("bot",`Erst ein kleiner Tipp – so lernst du mehr. Versuch es nochmal (${ctx?ctx.fails:0}/${HINT_THRESHOLD} Fehlversuche), drück „Ich geb's auf“ oder frag später nochmal nach der Lösung.`);
  }
  if(agentOn()) return agentChat();
  /* Mit eigenem API-Key: alles andere beantwortet die echte KI (nach denselben Regeln) */
  if(S.chat.apiKey) return chatAPI(raw);
  if(/(^|[^a-zäöü])(hi|hallo|hey|moin|servus|guten (morgen|tag|abend))([^a-zäöü]|$)/i.test(raw)){
    const c=activeChar();
    return pushMsg("bot",`Hallo, ${userName()}! ${c?c.name+" an deiner Seite. ":""}Wie kann ich helfen – Tipp, Erklärung oder Motivation?`);
  }
  if(/motiv|kaputt|schaffnicht|keinbock|keinelust|lustlos|mude|langweil|stress|angst/.test(t)){
    const c=activeChar();
    const m=["Kleiner Schritt zählt: 5 Minuten reichen für eine halbe Lektion. Danach darfst du aufhören – versprochen. 💪",
             "Streak-Frage: Heute schon gelernt? Wenn nicht, eine kurze Runde – dann brennt die Flamme weiter. 🔥",
             "Fehler sind Daten, kein Versagen. Jede falsche Aufgabe ist eine, die du beim nächsten Mal richtig hast. 🚀"];
    return pushMsg("bot", m[Math.floor(Math.random()*m.length)]+(c&&c.traits.motivation>70?"\n– und du schaffst das, ich kenne dich jetzt!":""));
  }
  if(/zusammenfass|kurzfass|uberblick|wasistdrin/.test(t)) return chatExplain();
  if(/wosteheich|fortschritt|statistik|punkte|^xp$|meinexp/.test(t)) return chatStats();
  if(/fallig|wiederhol/.test(t)) return chatDue();
  if(/^(testmich|quizmich|quiz|fragemich|prufmich|test)/.test(t)){
    const sid = V.subj || (S.stats.lastSubject||allSubjectIds()[0]);
    pushMsg("bot","Klar – los geht's! 💪");
    setTimeout(()=>{ startLesson(sid, nextLessonFor(sid).id); toggleChatIfOpen(); }, 500);
    return;
  }
  if(/tipp|hint/.test(t)) return chatTip(false);
  if(/erklar|ichversteh|wasbedeutet/.test(t)) return chatExplain();
  /* Offline-Best-of-Antworten */
  const c=activeChar();
  const generic=[
    `Ich bin offline unterwegs – aber dafür zuverlässig: Öffne eine Lektion und drück „💡 Tipp“, dann tippe ich genau zu deiner Frage. Oder frage „Erklär das Thema“.`,
    `Kleiner Trick: Lies dir erst die Antwortmöglichkeiten durch, bevor du die Frage zweimal liest – oft fällt die Hälfte sofort weg. 🧠`,
    `Für neue Aufgaben bin ich auf den 🤖 Agenten angewiesen – der holt Stoff aus deinem Obsidian-Vault und der Schul-Website.`
  ];
  pushMsg("bot", generic[Math.floor(Math.random()*generic.length)]);
  renderQuick();
}

async function pingAgent(silent){

    const ctl=new AbortController(); const h=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch(BRIDGE+"/ping",{signal:ctl.signal}); clearTimeout(h);
    const j=await r.json();

    const cbxChanged=await cbxCheck(j.cbx);
    if(cbxChanged && V.view==="settings" && !typingNow()) render();
    if(j.status) S.agent.status=j.status;
    save(); renderTop(); agentChanged(wasOn);
    if(!silent) toast(j.ok?`Verbunden ✓ (OpenCode: ${j.opencode||"nicht gefunden"})`:"Keine Verbindung – Bridge läuft nicht");
    redraw();
    return j;
  }catch(e){
    S.agent.connected=false; S.agent.full=false; AGENT_TIPP=false; TTS_ON=false; CBX.ready=false; save(); renderTop(); agentChanged(wasOn);
    if(!silent) toast("Keine Verbindung – starte opencode-verbinden.cmd");
    redraw();
    return null;
  }

function requestAgent(typ){
  const topic = V.subj&&subjById(V.subj) ? nextLessonFor(V.subj) : null;
  let text="";
  const base=` (Klasse ${S.profile.klasse}, Schule ${S.profile.school}). `;
  if(typ==="aufgaben") text=`AUFTRAG neue Aufgaben: Erstelle 8–12 neue Übungs-Aufgaben (Multiple Choice, Karteikarten, Lückentext, freie Eingabe) für das Thema „${topic?topic.name:"aktueller Stoff"}“${base}Quellen: ${vaultLabel()} und ${schoolLabel()}. Schreibe das Ergebnis ausschließlich nach content/erweiterungen.js im Schema aus AGENT.md.`;
  if(typ==="pruefung") text=`AUFTRAG Prüfungsstoff: Recherchiere, welche Tests/Klassenarbeiten/Prüfungen auf mich zukommen (Termine, Themen) – Quellen: ${vaultLabel()} (Termine, Blockplan, Fachnotizen) und ${schoolLabel()}. Erstelle daraus prüfungsnahe Übungen${base}und trage bekannte Termine als Übersicht nach content/erweiterungen.js ein (Feld "termine").`;
  if(typ==="sprache") text=`AUFTRAG Sprachen: Generiere ein Sprachpaket für „${(S.profile.langs||["Englisch"])[0]||"Englisch"}“ mit 15 Vokabelpaaren (Schule/IT/Alltag) und 2 Telefon-Dialogen (je 5–7 Schritte) im Schema aus AGENT.md nach content/erweiterungen.js (Feld "sprachen", inkl. "lang"-Code).${base}`;
  if(typ==="vault") text=`AUFTRAG Vault: Lies alle aktuellen Notizen in ${vaultLabel()}, finde neuen Lernstoff seit der letzten Verarbeitung (Fach-Notizen, Mitschriften) und baue daraus Übungen im Schema aus AGENT.md in content/erweiterungen.js ein. Prüfe dabei auch, ob wichtige Termine/Prüfungen fehlen.${base}`;
  if(typ==="frei"){ const el=$("agFree"); text=(el&&el.value.trim())?el.value.trim():null; if(!text) return toast("Erst einen Text schreiben!"); }
  if(typ==="pc"){
    const el=$("agPc"); text=el?el.value.trim():"";
    if(!text) return toast("Erst beschreiben, was der Agent am PC tun soll!");
    if(!S.agent.connected || !S.agent.full) return toast("Vollzugriff ist nicht aktiv – opencode-verbinden.cmd mit „J“ starten");
    return sendAuftrag(typ, text);
  }
  sendAuftrag(typ, text);
}
async function sendAuftrag(typ, text){
  const payload={typ, text, vault:S.agent.vaultPath||"", ts:new Date().toISOString()};
  if(S.agent.connected && agentAllowed()){
    const post=()=>fetch(BRIDGE+"/auftrag",{method:"POST",headers:{"Content-Type":"application/json","X-Lernhub-Token":window.LERNHUB_TOKEN||""},body:JSON.stringify(payload)});
    try{
      let r=await post();
      if(r.status===403 && await loadToken()) r=await post();      /* Bridge wurde neu gestartet → neuer Token */
      if(r.ok){
        if(typ==="pc"){ AGENT_PC=""; const el=$("agPc"); if(el) el.value=""; toast("Bitte jetzt am PC im Windows-Fenster bestätigen 🔓"); }
        else toast("Auftrag geschickt – der Agent arbeitet. Du kannst weiterlernen! 🚀");
        pingAgent(true); return;
      }
      if(typ==="pc") return toast("Bridge lehnt Vollzugriff ab – opencode-verbinden.cmd neu starten und „J“ wählen");
    }catch(e){}
  }
  if(typ==="pc") return toast("Agent nicht verbunden – Vollzugriff geht nur über die lokale Bridge");
  /* Offline-Fallback: Prompt kopieren + Anleitung */
  copyText(text+"\n\n---\nVerbinde dich mit der Lernhub-App: "+connectPrompt());
  toastModal(`<h2 style="margin-top:0">🤖 Agent nicht verbunden</h2>
    <p>Der Auftrag wurde <b>in die Zwischenablage kopiert</b>. So geht's weiter:</p>
    <ol style="line-height:2">
      <li>Im Ordner <span class="kbd">lernhub</span> doppelklick auf <b>opencode-verbinden.cmd</b> (installiert OpenCode bei Bedarf)</li>
      <li>Im geöffneten OpenCode-Fenster den kopierten Prompt <b>einfügen</b> (Strg+V) und Enter drücken</li>
      <li>Danach hier „Verbindung prüfen“ – Aufträge laufen dann automatisch über die Bridge</li>
    </ol>
    <pre class="code">${esc(text.slice(0,400))}${text.length>400?" …":""}</pre>
    <button class="btn" onclick="closeModal()">Alles klar</button>
    <button class="btn ghost" onclick="closeModal();copyText(connectPrompt())">Verbindungs-Prompt kopieren</button>`);
}

function importData(input){
  const f=input.files[0]; if(!f) return;
  if(f.size>20*1024*1024) return toast("Datei zu groß");
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    if(!o || typeof o!=="object" || !o.v || !o.profile) throw 0;
    const clean=sanitizeState(o);
    clean.chat.apiKey=S.chat.apiKey;            /* lokalen Key behalten */
    clean.untis.url=S.untis.url;                /* Untis-Link (enthält Geheim-Token) bleibt lokal */
    localStorage.setItem(LS_KEY, JSON.stringify(clean)); location.reload();
  }catch(e){ toast("Datei ist kein Lernhub-Backup"); } };
  rd.readAsText(f);
}

function newCustomSubject(){
  toastModal(`<h2 style="margin-top:0">➕ Eigenes Fach</h2>
    <p class="small mut">Für alles außer Schule: Mathe-Formeln, Vokabeln fürs Hobby, Kochwissen … einfach Fragen eintragen.</p>
    <label class="fl">Fachname</label><input class="fi" id="csName" placeholder="z. B. Mathe, Kochen, Fotografie">
    <label class="fl">Themenname</label><input class="fi" id="csTopic" placeholder="z. B. Grundlagen" value="Start">
    <label class="fl">Aufgaben – pro Zeile: Frage | Antwort</label>
    <textarea class="ta" id="csQ" style="min-height:140px" placeholder="Was ist die Ableitung von x²? | 2x&#10;Wofür steht PI? | Kreiszahl, ca. 3,14159"></textarea>
    <div class="center" style="margin-top:12px">
      <button class="btn" onclick="createCustomSubject()">Fach anlegen</button>
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>`);
}
function createCustomSubject(){
  const name=($("csName").value||"").trim(); if(!name) return toast("Name fehlt");
  const topic=($("csTopic").value||"Start").trim();
  const lines=($("csQ").value||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const mc=lines.map(l=>{ const p=l.split("|"); if(p.length<2) return null;
    const q=p[0].trim(), a=p.slice(1).join("|").trim();
    return (q&&a)?{q,a}:null; }).filter(Boolean);
  if(!mc.length) return toast("Mindestens eine Zeile im Format Frage | Antwort");
  /* Falsche Antworten kommen aus den anderen eigenen Antworten (plausibler als Fantasie-Optionen) */
  const filler=["Keine der anderen Antworten","Das stimmt so nicht","Ich bin mir nicht sicher"];
  const quiz=mc.map((m,i)=>{
    const others=shuffle(mc.filter((_,j)=>j!==i&&mc[j].a!==m.a).map(o=>o.a)).slice(0,3);
    const wrongs=others.concat(filler).slice(0,3);
    return {q:m.q, c:[m.a].concat(wrongs), a:0, w:"Laut deiner eigenen Notiz: "+m.a};
  });
  const id="own"+Date.now();
  const colors=["#e84393","#0984e3","#6c5ce7","#00b894","#e17055","#fdcb6e"];
  const subj={id, name:name.slice(0,60), color:colors[Math.floor(Math.random()*colors.length)],
    topics:[{id:id+"_t1", name:topic.slice(0,120)||"Start", mc:quiz,
      cards:mc.slice(0,8).map(m=>({f:m.q, b:m.a})),
      gaps:[], free:mc.slice(0,8).map(m=>({q:m.q, a:[m.a], w:"Laut deiner eigenen Notiz: "+m.a}))}]};
  const clean=cleanSubject(subj); if(!clean) return toast("Das Fach konnte nicht angelegt werden");
  S.custom.subjects.push(clean); save(); closeModal();
  toast("Fach angelegt ✓"); openSubject(id);
}
/* ===================== 14) START ===================== */
function init(){
  pruneReview();
  if(window.plusInit) plusInit();
  if(window.cloudInit) cloudInit();
  if(window.kontoInit) kontoInit();
  if(window.extraInit) extraInit();
  renderNav(); renderTop(); updateChatHead();
  if(!S.seenOnboard){ ob.name=S.profile.name||""; ob.daily=S.profile.daily||20; ob.goal=S.profile.goal||"schule";
    ob.langs=(S.profile.langs||["Englisch"]).slice(); V.view="onboard"; }
  /* Anmelde-Bildschirm einmal beim Start zeigen (nur wenn Konten eingerichtet sind) */
  if(window.cloudCfg && cloudCfg() && !CLOUD && !S.authAsked && V.view!=="konto"){ KONTO.welcome=true; V.view="konto"; }
  render();
  if(!S.seenTour) setTimeout(tourMaybe, 1200);
  /* Sprachausgabe: Stimmen laden (Chrome lädt sie asynchron) */
  if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
  /* Chat-Eingabe */
  $("chatIn").addEventListener("keydown", e=>{ if(e.key==="Enter") sendChat(); });
  /* Modal schließen */
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
  /* Enter = "Weiter" nach einer beantworteten Aufgabe (wie bei Duolingo) */
  document.addEventListener("keydown", e=>{
    if(e.key!=="Enter" || e.repeat || V.view!=="lesson" || !LES || !LES.checked || LES.completed) return;
    const t=e.target; if(t && /^(BUTTON|A|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if(!$("modal") || $("modal").classList.contains("hidden")){ e.preventDefault(); nextItem(); }
  });
  /* Tastenkürzel am PC: 1–9 = Antwort, Leertaste = Karte umdrehen, dann 1 = Gewusst / 2 = Nochmal */
  document.addEventListener("keydown", e=>{
    if(V.view!=="lesson" || !LES || LES.checked || LES.completed || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const t=e.target; if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if($("modal") && !$("modal").classList.contains("hidden")) return;
    const it=curItem(); if(!it) return;
    if(it.kind==="mc" && it.perm && /^[1-9]$/.test(e.key) && +e.key<=it.perm.length){ e.preventDefault(); answerMc(+e.key-1); }
    else if(it.kind==="card" && !LES.flipped && e.key===" " && !(t && t.tagName==="BUTTON")){ e.preventDefault(); LES.flipped=true; renderLesson(); }
    else if(it.kind==="card" && LES.flipped && (e.key==="1" || e.key==="2")){ e.preventDefault(); answerCard(e.key==="1"); }
  });
  /* Agenten-Ping: beim Start + im Agent-Panel alle 15 s (zeichnet nur bei Änderung neu, nie während du tippst) */
  setTimeout(()=>pingAgent(true), 800);
  setInterval(()=>{ if(V.view==="agent" || Date.now()-(S.agent.lastPing||0)>55000) pingAgent(true); }, 15000);
  /* Heute neu? (Akku, Tagesziel) */
  heartsRefill();
  if(S.stats.todayDay!==today()){ S.stats.todayDay=today(); S.stats.todayXP=0; save(); renderTop(); }
}
init();

</script>
