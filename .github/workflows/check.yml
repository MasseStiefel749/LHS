# Sicherheitsnetz: Syntax, doppelte globale Namen, fehlende Dateien und Schema von content/erweiterungen.js
name: Selbsttest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check.mjs
